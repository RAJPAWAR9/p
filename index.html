<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--surface:#fff;--ink:#14161f;--muted:#5d6475;--line:#d9dee8;--accent:#3b4cff;--accent-ink:#fff;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#12141c;--surface:#1b1e29;--ink:#eceef5;--muted:#9aa1b4;--line:#2c3040;--accent:#8c97ff;--accent-ink:#10122a;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Sora,system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:960px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 16px;letter-spacing:-.02em}
.bar{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{font:inherit;color:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#q{flex:1 1 320px}
button{cursor:pointer}
button.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.opts{margin:8px 0 12px;color:var(--muted);font-size:.9rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#stage{margin:12px 0}
.frame{aspect-ratio:16/9;width:100%;border:0;border-radius:14px;background:#000;display:block}
audio{width:100%}
#title{font-weight:600;margin:10px 0 0}
#msg{color:var(--err);margin:8px 0;min-height:1.4em}
#msg.info{color:var(--muted)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0}
.card.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--line)}
.card div{padding:10px 12px;font-size:.9rem}
.card small{color:var(--muted);display:block;margin-top:2px}
</style>
</head>
<body>
<main>
  <h1>My Player</h1>

  <div class="bar">
    <input id="q" type="text" placeholder="Paste a YouTube link or video ID, or type a search" aria-label="Link, video ID or search">
    <select id="mode" aria-label="Playback mode">
      <option value="auto">Auto (recommended)</option>
      <option value="embed">Embed player</option>
      <option value="video">Custom video player</option>
      <option value="audio">Audio only</option>
    </select>
    <button class="go" id="go">Play</button>
  </div>

  <div class="opts">
    <span id="server">Server: auto</span>
  </div>

  <div id="msg" role="status"></div>
  <pre id="log" style="white-space:pre-wrap;font-size:.8rem;color:var(--muted);margin:0 0 8px"></pre>
  <div id="stage"></div>
  <div id="grid"></div>
</main>

<script>
// Servers are tried in this order. Add or remove entries here.
const INSTANCES = [
  'https://invidious.tiekoetter.com',
  'https://invidious.nerdvpn.de',
  'https://yt.chocolatemoo53.com',
  'https://invidious.f5.si',
  'https://inv.nadeko.net'
];

const $ = s => document.querySelector(s);
const q = $('#q'), mode = $('#mode'), msg = $('#msg'), stage = $('#stage'), grid = $('#grid');
const serverEl = $('#server');

let last = 0;          // index of the server that worked last
let current = null;    // id of the video on screen

const say = (t, info) => { msg.textContent = t; msg.className = info ? 'info' : ''; };
const useServer = h => { serverEl.textContent = 'Server: ' + h.replace('https://', ''); };
const order = () => INSTANCES.map((_, i) => INSTANCES[(last + i) % INSTANCES.length]);

function videoId(s) {
  s = s.trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  const m = s.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/);
  return m ? m[1] : null;
}

function timeout(ms) {
  const c = new AbortController();
  setTimeout(() => c.abort(), ms);
  return c.signal;
}

// Tries each server until one returns JSON. Gives back { data, host }.
async function api(path) {
  for (const host of order()) {
    try {
      say('Trying ' + host.replace('https://', '') + '...', true);
      const r = await fetch(host + path, { signal: timeout(9000) });
      if (!r.ok) continue;
      const data = await r.json();
      last = INSTANCES.indexOf(host);
      useServer(host);
      return { data, host };
    } catch (e) { /* try the next server */ }
  }
  throw new Error('No server answered. Check your internet or try again in a minute.');
}

// For embeds: find the first server that is reachable.
async function reachable(skip) {
  for (const host of order()) {
    if (skip && skip.includes(host)) continue;
    try {
      say('Trying ' + host.replace('https://', '') + '...', true);
      await fetch(host + '/', { mode: 'no-cors', signal: timeout(7000) });
      return host;
    } catch (e) { /* next */ }
  }
  return null;
}

function showEmbed(host, id) {
  useServer(host);
  const f = document.createElement('iframe');
  f.className = 'frame';
  f.allowFullscreen = true;
  f.allow = 'autoplay; picture-in-picture';
  f.src = host + '/embed/' + id + '?autoplay=1';
  stage.innerHTML = '';
  stage.append(f);
  say('');
}

// Loads a real stream from one server and waits until it is ready to play.
async function loadStream(host, id, kind) {
  const r = await fetch(host + '/api/v1/videos/' + id + '?local=true', { signal: timeout(9000) });
  if (!r.ok) throw new Error('bad status');
  const d = await r.json();
  const abs = u => u.startsWith('http') ? u : host + u;
  let el, url;
  if (kind === 'audio') {
    const a = (d.adaptiveFormats || []).filter(x => (x.type || '').startsWith('audio'))
      .sort((x, y) => (+y.bitrate || 0) - (+x.bitrate || 0))[0];
    if (!a) throw new Error('no audio');
    el = document.createElement('audio'); url = abs(a.url);
  } else {
    const v = (d.formatStreams || []).slice(-1)[0];
    if (!v) throw new Error('no video');
    el = document.createElement('video'); el.className = 'frame'; el.playsInline = true; url = abs(v.url);
  }
  el.preload = 'auto';
  await new Promise((ok, bad) => {
    const t = setTimeout(() => bad(new Error('slow')), 15000);
    el.onloadeddata = () => { clearTimeout(t); ok(); };
    el.onerror = () => { clearTimeout(t); bad(new Error('error')); };
    el.src = url;
    el.load();
  });
  return { el, title: d.title };
}

async function play(id, label, skip = []) {
  current = id;
  stage.innerHTML = '';
  const m = mode.value;

  if (m === 'embed') {
    const host = await reachable();
    return host ? showEmbed(host, id) : say('No server answered. Check your internet and try again.');
  }

  const kind = m === 'audio' ? 'audio' : 'video';
  const log = $('#log'); log.textContent = '';
  for (const host of order()) {
    if (skip.includes(host)) continue;
    try {
      say('Trying ' + host.replace('https://', '') + '...', true);
      const { el, title } = await loadStream(host, id, kind);
      last = INSTANCES.indexOf(host);
      useServer(host);
      el.controls = true;
      el.autoplay = true;
      // If this server breaks mid-way, move on to the next one automatically.
      el.addEventListener('error', () => play(id, label, [...skip, host]));
      stage.innerHTML = '';
      stage.append(el);
      const t = document.createElement('div');
      t.id = 'title'; t.textContent = title || label || '';
      stage.append(t);
      el.play().catch(() => {});
      return say('');
    } catch (e) {
      const why = e.name === 'AbortError' ? 'no answer (timeout)' : e.message === 'Failed to fetch' ? 'blocked or offline (CORS/captcha)' : e.message;
      log.textContent += host.replace('https://', '') + ': ' + why + '\n';
    }
  }

  // Every server failed to give a stream: fall back to the embed player.
  if (m === 'auto') {
    say('Streams are not available, using the embed player...', true);
    const host = await reachable();
    if (host) return showEmbed(host, id);
  }
  say('No server could play this video. Try again in a minute.');
}

async function search(term) {
  grid.innerHTML = '';
  try {
    const { data, host } = await api('/api/v1/search?type=video&q=' + encodeURIComponent(term));
    const vids = data.filter(x => x.type === 'video');
    if (!vids.length) return say('No results. Try different words.');
    say('');
    vids.forEach(v => {
      const c = document.createElement('button');
      c.className = 'card';
      const th = (v.videoThumbnails || []).find(t => t.quality === 'medium') || (v.videoThumbnails || [])[0];
      const img = document.createElement('img');
      img.loading = 'lazy'; img.alt = '';
      if (th) img.src = th.url.startsWith('http') ? th.url : host + th.url;
      const box = document.createElement('div');
      box.textContent = v.title;
      const by = document.createElement('small');
      by.textContent = v.author || '';
      box.append(by);
      c.append(img, box);
      c.onclick = () => {
        grid.querySelectorAll('.card.on').forEach(x => x.classList.remove('on'));
        c.classList.add('on');
        stage.innerHTML = '<div id="title">Loading: ' + v.title.replace(/</g, '&lt;') + '</div>';
        scrollTo({ top: 0, behavior: 'smooth' });
        play(v.videoId, v.title);
      };
      grid.append(c);
    });
  } catch (e) {
    say('Search is not available right now. Paste a video link or ID instead.');
  }
}

function run() {
  const val = q.value.trim();
  if (!val) return say('Enter a link, video ID or search term.');
  grid.innerHTML = '';
  const id = videoId(val);
  id ? play(id) : search(val);
}

$('#go').onclick = run;
q.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
</script>
</body>
</html>

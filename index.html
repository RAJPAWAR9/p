<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invidious Music Player</title>
<style>
:root{--bg:#fff;--card:#f3f3f6;--fg:#15151a;--mut:#6b6b78;--ac:#7c3aed}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f14;--card:#1a1a22;--fg:#f1f1f5;--mut:#9a9aa8}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:150px}
header{padding:16px;display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}
input,button{font:inherit;color:var(--fg);background:var(--card);border:0;border-radius:10px;padding:10px 14px}
#q{flex:1;min-width:180px}
button{cursor:pointer}button:hover{filter:brightness(1.1)}
.go{background:var(--ac);color:#fff}
#inst{width:100%;font-size:12px;color:var(--mut)}
#status{padding:0 16px;color:var(--mut);font-size:14px;min-height:20px}
#list{padding:8px 16px;display:grid;gap:8px;max-width:800px;margin:auto}
.row{display:flex;gap:12px;align-items:center;background:var(--card);padding:8px;border-radius:12px;cursor:pointer}
.row.on{outline:2px solid var(--ac)}
.row img{width:96px;height:54px;object-fit:cover;border-radius:8px;background:#888}
.row b{display:block;font-size:14px;line-height:1.3}
.row small{color:var(--mut)}
.row .add{margin-left:auto;padding:6px 10px}
#bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);padding:12px 16px;box-shadow:0 -2px 12px #0003}
#bar .in{max-width:800px;margin:auto}
#now{font-size:14px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seek{width:100%;accent-color:var(--ac)}
.ctl{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:6px}
.ctl button{background:transparent;font-size:20px;padding:6px 12px}
.ctl .p{background:var(--ac);color:#fff;border-radius:50%;width:48px;height:48px;padding:0}
#vol{width:90px;accent-color:var(--ac)}
.t{font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
</style>
</head>
<body>
<header>
  <input id="q" placeholder="Search songs, artists…" autofocus>
  <button class="go" id="sb">Search</button>
  <input id="inst" placeholder="Invidious instance URL (e.g. https://yewtu.be)">
</header>
<div id="status"></div>
<div id="list"></div>

<div id="bar"><div class="in">
  <div id="now">Nothing playing</div>
  <input type="range" id="seek" min="0" max="1000" value="0">
  <div class="t"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="ctl">
    <button id="prev">⏮</button>
    <button id="pp" class="p">▶</button>
    <button id="next">⏭</button>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="1">
  </div>
</div></div>
<audio id="au" preload="auto"></audio>

<script>
const $=id=>document.getElementById(id);
const au=$('au');
const FALLBACKS=['https://yewtu.be','https://inv.nadeko.net','https://invidious.nerdvpn.de'];
let results=[],queue=[],idx=-1;

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
$('inst').value=store('inst')||'';
$('inst').onchange=()=>store('inst',$('inst').value.trim());

function instances(){
  const u=$('inst').value.trim().replace(/\/+$/,'');
  return u?[u,...FALLBACKS.filter(x=>x!==u)]:FALLBACKS;
}
async function api(path){
  let err;
  for(const base of instances()){
    try{
      const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),9000);
      const r=await fetch(base+path,{signal:ctl.signal});clearTimeout(t);
      if(!r.ok)throw new Error(r.status);
      const j=await r.json();
      return {data:j,base};
    }catch(e){err=e}
  }
  throw err||new Error('No instance responded');
}
const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function search(){
  const q=$('q').value.trim();if(!q)return;
  $('status').textContent='Searching…';
  try{
    const {data,base}=await api('/api/v1/search?type=video&q='+encodeURIComponent(q));
    results=data.filter(v=>v.type==='video').map(v=>({
      id:v.videoId,title:v.title,author:v.author,len:v.lengthSeconds,
      thumb:'https://i.ytimg.com/vi/'+v.videoId+'/mqdefault.jpg'
    }));
    queue=results.slice();idx=-1;
    $('status').textContent=results.length+' results via '+base;
    render();
  }catch(e){
    $('status').textContent='Search failed. Set a working Invidious instance (with API enabled) above. ('+e.message+')';
  }
}
function render(){
  $('list').innerHTML=results.map((v,i)=>`<div class="row ${queue[idx]&&queue[idx].id===v.id?'on':''}" data-i="${i}">
    <img src="${v.thumb}" loading="lazy" onerror="this.style.visibility='hidden'">
    <div><b>${esc(v.title)}</b><small>${esc(v.author)} · ${fmt(v.len)}</small></div></div>`).join('');
}
$('list').onclick=e=>{
  const r=e.target.closest('.row');if(!r)return;
  queue=results.slice();play(+r.dataset.i);
};

async function play(i){
  if(i<0||i>=queue.length)return;
  idx=i;const v=queue[i];
  $('now').textContent='Loading: '+v.title;render();
  try{
    const {data,base}=await api('/api/v1/videos/'+v.id+'?local=true&fields=adaptiveFormats,formatStreams');
    const aud=(data.adaptiveFormats||[]).filter(f=>(f.type||'').startsWith('audio/'));
    // prefer mp4/aac (widest browser support), highest bitrate
    aud.sort((a,b)=>((b.type.includes('mp4'))-(a.type.includes('mp4')))||(b.bitrate-a.bitrate));
    let url=aud[0]&&aud[0].url;
    if(!url&&data.formatStreams&&data.formatStreams[0])url=data.formatStreams[0].url;
    if(!url)url=base+'/latest_version?id='+v.id+'&itag=140&local=true';
    if(url.startsWith('/'))url=base+url;
    au.src=url;
    await au.play();
    $('now').textContent='▶ '+v.title+' — '+v.author;
    document.title=v.title;
    if('mediaSession' in navigator){
      navigator.mediaSession.metadata=new MediaMetadata({title:v.title,artist:v.author,artwork:[{src:v.thumb}]});
      navigator.mediaSession.setActionHandler('previoustrack',()=>play(idx-1));
      navigator.mediaSession.setActionHandler('nexttrack',()=>play(idx+1));
    }
  }catch(e){
    $('now').textContent='Could not play "'+v.title+'" ('+e.message+') — skipping';
    setTimeout(()=>play(idx+1),1500);
  }
}
$('sb').onclick=search;
$('q').onkeydown=e=>{if(e.key==='Enter')search()};
$('pp').onclick=()=>{if(!au.src)return;au.paused?au.play():au.pause()};
$('next').onclick=()=>play(idx+1);
$('prev').onclick=()=>{au.currentTime>3?au.currentTime=0:play(idx-1)};
$('vol').oninput=e=>au.volume=e.target.value;
au.onplay=()=>$('pp').textContent='⏸';
au.onpause=()=>$('pp').textContent='▶';
au.onended=()=>play(idx+1);
au.ontimeupdate=()=>{
  if(au.duration){$('seek').value=au.currentTime/au.duration*1000;$('dur').textContent=fmt(au.duration)}
  $('cur').textContent=fmt(au.currentTime);
};
$('seek').oninput=e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration};
</script>
</body>
</html>
